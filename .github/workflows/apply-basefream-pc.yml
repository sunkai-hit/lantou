name: Apply BaseFream PC Style
on:
  push:
    paths:
      - 'tools/apply_basefream_pc.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PC style upgrade
        run: python tools/apply_basefream_pc.py
      - name: Commit updated prototype
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: align PC prototype with BaseFream style"
          git push
