dding-left:18px}.ti{position:relative;padding:0 0 16px}.ti:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;left:-24px;top:4px;background:#fff;border:3px solid #b8c5d7}.ti.done:before{background:var(--blue);border-color:var(--blue)}.ti.now:before{border-color:var(--orange)}.ti b{display:block;color:var(--navy);font-size:13px}.photo{height:110px;border-radius:14px;background:linear-gradient(135deg,#cfdfee,#f4f9ff 50%,#b7cee1);position:relative;overflow:hidden}.photo:after{content:"💧";font-size:42px;position:absolute;right:22%;bottom:12px;opacity:.55}.photo.ok{background:linear-gradient(135deg,#dcefe7,#f9fffc)}.photo.ok:after{content:"✓";color:var(--green)}.phonebox{display:grid;place-items:center;padding:14px}.phone{width:390px;min-height:790px;background:#fff;border:9px solid #172033;border-radius:42px;overflow:hidden;position:relative;box-shadow:0 22px 50px #1720332b}.status{height:36px;padding:8px 16px;font-size:11px;display:flex;justify-content:space-between}.mob{min-height:736px;background:#f5f8fc;padding-bottom:78px}.mh{margin:0 12px 12px;background:linear-gradient(135deg,#1075ff,#50a0ff);color:#fff;padding:20px;border-radius:21px}.mh h2{margin:6px 0;font-size:21px}.mh p{margin:0;font-size:12px;opacity:.9}.mc{background:#fff;margin:11px 12px;padding:15px;border-radius:17px;box-shadow:0 5px 15px #20466f0b}.mct{font-size:15px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;gap:8px;margin-bottom:11px}.mct span{font-size:10px;color:#99a3b3;font-weight:500}.serv{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.sv{text-align:center;font-size:10px;cursor:pointer}.svi{width:45px;height:45px;border-radius:15px;background:#eff6ff;color:var(--blue);display:grid;place-items:center;margin:0 auto 6px;font-size:18px}.sv:first-child .svi{background:var(--blue);color:#fff}.row{padding:11px 0;border-bottom:1px solid #edf1f6;display:flex;justify-content:space-between;gap:12px;align-items:center}.row:last-child{border:0}.bot{position:absolute;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-top:8px}.bot div{text-align:center;font-size:10px;color:#8e99aa;cursor:pointer}.bot .on{color:var(--blue);font-weight:700}.mphead{background:#fff;padding:5px 15px 11px;display:flex;gap:10px;align-items:center}.back{border:0;width:33px;height:33px;border-radius:11px;background:#f2f5f9;cursor:pointer}.fs{background:#fff;margin:11px 12px;padding:15px;border-radius:17px}.fl{font-size:12px;font-weight:700;margin-bottom:9px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #e3e9f1;padding:7px 10px;border-radius:9px;font-size:11px}.chip.on{border-color:#8bbcff;background:#eef6ff;color:var(--blue);font-weight:700}.loc{background:#f3f8ff;border:1px solid #dceaff;border-radius:12px;padding:11px;font-size:12px}.ta{width:100%;height:84px;border:1px solid #e2e8ef;border-radius:11px;background:#fbfcfe;padding:10px;resize:none}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photos .photo{height:92px}.submit{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:11px 15px 16px}.submit .btn{width:100%;padding:12px}.sc{text-align:center;background:#fff;margin:11px 12px;padding:17px;border-radius:18px}.bigic{width:60px;height:60px;border-radius:21px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;margin:auto;font-size:27px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.metrics div{background:#f7f9fc;border-radius:11px;padding:9px}.metrics b{display:block;color:var(--navy)}.staff{border:1px solid #e5ebf2;border-radius:14px;padding:12px;margin-top:9px;cursor:pointer}.staff.sel{border-color:#7fb6ff;background:#f2f8ff}.map{height:210px;background:linear-gradient(145deg,#eef6ff,#fbfdff);border-radius:16px;position:relative;overflow:hidden}.bd{position:absolute;background:#fff;border:1px solid #dbe7f4;border-radius:10px;padding:9px;box-shadow:0 5px 14px #1d4b7512;font-size:12px}.b3{left:18%;top:30px}.b5{right:15%;top:45px}.b8{left:55%;bottom:25px}.warn{padding:12px 14px;background:#fff8e8;border:1px solid #ffe0a0;border-radius:12px;color:#8d6415;font-size:12px}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.g4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.tabs{display:none}}@media(max-width:600px){.top{padding:0 10px;height:56px}.logo span{display:none}.main{padding:10px}.phonebox{padding:0}.phone{width:100%;min-height:calc(100vh - 56px);border:0;border-radius:0;box-shadow:none}.status{display:none}.mob{min-height:calc(100vh - 56px)}.g4,.g3,.g2{grid-template-columns:1fr}}

<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var D={id:'LT202609030018',pro:'蓝海嘉园',loc:'3号楼 2单元 一楼公共区域',txt:'一楼楼道水管漏水，地面积水比较严重，请尽快处理。',s:0,staff:'王海'};
var names=['待物业受理','已受理','已派单','维修人员已接单','已到达现场','待居民确认','已完成'];
var stepNames=['居民上报','物业受理','完成派单','人员接单','到达现场','提交完成','居民确认'];
var times=['09:32','09:34','09:36','09:38','09:46','10:08','10:11'];
function go(x){location.hash=x;render()}

window.go=go;window.setS=setS;window.resetDemo=resetDemo;
function currentRole(){var h=location.hash||'#hub';if(h.indexOf('resident')>-1)return'resident';if(h.indexOf('work')>-1)return'work';if(h.indexOf('staff')>-1)return'staff';if(h.indexOf('group')>-1)return'group';return'hub'}
function top(inner){var r=currentRole();var a=[['hub','演示导航'],['resident-home','居民小程序'],['work-center','工单中心'],['staff-tasks','工作人员'],['group-dashboard','集团监管']];var btns=a.map(function(x){var on=(r==='hub'&&x[0]==='hub')||x[0].indexOf(r)===0;return '<button class="'+(on?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');return '<div class="top"><div class="logo"><div class="mark">⌁</div><span>蓝投一码呼 · V0.1</span></div><div class="tabs">'+btns+'</div><button class="reset" onclick="resetDemo()">重置演示</button></div>'+inner}
function pc(c){var r=currentRole();var N=r==='group'?[['group-dashboard','集团驾驶舱'],['group-trace','工单穿透']]:[['work-center','工单中心'],['work-detail','工单详情'],['work-dispatch','受理派单']];var nav=N.map(function(x){return '<div class="nav '+(location.hash==='#'+x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</div>'}).join('');var org=r==='group'?'🏢 蓝投集团运营管理':'🏠 蓝海嘉园物业服务中心';return top('<div class="shell"><aside class="side"><div class="st">当前角色</div><div class="nav on">'+org+'</div><div class="st" style="margin-top:14px">演示页面</div>'+nav+'<div class="st" style="margin-top:16px">统一工单</div><div class="card" style="padding:11px;box-shadow:none;background:#f7f9fc"><div class="tiny muted">'+D.id+'</div><div class="small title" style="margin-top:4px">公共区域漏水</div><div style="margin-top:7px"><span class="pill '+(D.s===0?'o':D.s>=5?'g':'')+'">'+names[D.s]+'</span></div></div></aside><main class="main">'+c+'</main></div>')}

function bot(on){return '<div class="bot"><div class="'+(on==='h'?'on':'')+'" onclick="go(\'resident-home\')">⌂<br>首页</div><div class="'+(on==='o'?'on':'')+'" onclick="go(\'resident-progress\')">▤<br>工单</div><div>◉<br>消息</div><div>○<br>我的</div></div>'}

function hub(){var roles=[['resident-home','⌁','居民小程序','扫码上报、查询进度、确认评价'],['work-center','▤','物业工单中心','受理、派单、跟踪、督办'],['staff-tasks','⚒','物业/网格人员','接单、到场、处理、反馈'],['group-dashboard','▦','集团监管','跨项目指标、工单全过程穿透']];return top('<main class="main"><div class="hero"><div><div class="tiny">文登蓝投 · 社区居民服务数字化演示</div><h1>“一码呼”V0.1 可交互原型</h1><p>一码连接居民 · 一单贯通服务 · 一屏掌握社区</p></div><span class="pill" style="background:#fff;color:#1779ff">无需服务器 · 双击HTML即可运行</span></div><div class="card mt demo"><div><div class="title">统一演示工单：'+D.id+'</div><div class="small muted">'+D.pro+' · '+D.loc+' · 公共区域漏水</div></div><div class="steps">'+stepNames.map(function(x,i){return '<span class="sp '+(i<D.s?'done':i===D.s?'now':'')+'">'+(i+1)+' '+x+'</span>'}).join('')+'</div></div><div class="grid g4 mt">'+roles.map(function(x){return '<div class="card role" onclick="go(\''+x[0]+'\')"><div class="ic">'+x[1]+'</div><h3>'+x[2]+'</h3><p>'+x[3]+'</p><span class="pill">进入演示 →</span></div>'}).join('')+'</div><div class="warn mt">建议演示顺序：居民上报 → 物业受理派单 → 工作人员到场处理 → 居民确认 → 集团全过程穿透监管。</div></main>')}
function residentHome(){return phone('<div class="mob"><div class="mh"><div class="tiny">📍 已识别社区二维码位置</div><h2>蓝海嘉园</h2><p>3号楼 · 2单元 ｜ 您好，孙先生</p></div><div class="mc"><div class="mct">居民服务 <span>一个二维码解决社区服务问题</span></div><div class="serv"><div class="sv" onclick="go(\'resident-report\')"><div class="svi">🔧</div>我要报修</div><div class="sv"><div class="svi">💬</div>我要反映</div><div class="sv"><div class="svi">!</div>我要投诉</div><div class="sv"><div class="svi">✦</div>我要建议</div><div class="sv"><div class="svi">♡</div>我要帮</div></div></div><div class="mc"><div class="mct">我的工单 <span onclick="go(\'resident-progress\')">全部 ›</span></div><div class="row" onclick="go(\'resident-progress\')"><div><b class="small">公共区域漏水</b><div class="tiny muted">'+D.id+' · '+D.loc+'</div></div><span class="pill '+(D.s===0?'o':D.s>=5?'g':'')+'">'+names[D.s]+'</span></div><div class="row"><div><b class="small">单元门禁失灵</b><div class="tiny muted">8月28日 · 已完成</div></div><span class="pill">已完成</span></div></div><div class="mc"><div class="mct">社区通知 <span>更多 ›</span></div><div class="small">9月3日 13:00—15:00 进行消防设施检查</div></div></div>'+bot('h'))}
function residentReport(){return phone('<div class="mob"><div class="mphead"><button class="back" onclick="go(\'resident-home\')">‹</button><b>我要报修</b></div><div class="fs"><div class="fl">问题类型</div><div class="chips"><span class="chip on">水电维修</span><span class="chip">电梯</span><span class="chip">门禁</span><span class="chip">公共设施</span><span class="chip">环境卫生</span></div></div><div class="fs"><div class="fl">问题位置</div><div class="loc"><b>📍 '+D.pro+' · '+D.loc+'</b><br><span class="tiny muted">由当前二维码自动识别，无需重复填写</span></div></div><div class="fs"><div class="fl">问题描述</div><textarea class="ta">'+D.txt+'</textarea><div class="fl" style="margin-top:10px">现场照片</div><div class="photos"><div class="photo"></div><div class="photo"></div></div><div class="chips" style="margin-top:10px"><span class="chip on">⚡ 情况比较紧急</span><span class="chip">🎙 语音描述</span></div></div><div class="submit"><button class="btn" onclick="setS(0);go(\'resident-progress\')">提交诉求</button></div></div>')}
