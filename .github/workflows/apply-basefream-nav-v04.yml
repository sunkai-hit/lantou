name: Apply BaseFream Navigation V0.4
on:
  push:
    paths:
      - 'tools/apply_basefream_nav_v04.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply BaseFream SimpleMenu navigation
        run: python tools/apply_basefream_nav_v04.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/lantou.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/lantou.js
      - name: Commit updated prototype
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: rebuild PC sidebar with BaseFream SimpleMenu"
          git push
