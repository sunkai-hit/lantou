<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝投一码呼 V0.1</title><style>

dius:18px;padding:18px;box-shadow:0 10px 28px #203b620c}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.mt{margin-top:18px}.ic{width:42px;height:42px;border-radius:14px;background:var(--b2);color:var(--b);display:grid;place-items:center;font-size:20px}.role{cursor:pointer}.role:hover{transform:translateY(-2px)}.role h3{margin:14px 0 5px;color:var(--n)}.role p{font-size:13px;color:var(--m);line-height:1.65}.demo{display:flex;justify-content:space-between;align-items:center;gap:20px}.steps{display:flex;gap:6px;flex-wrap:wrap}.sp{font-size:11px;padding:6px 8px;border-radius:999px;background:#f1f4f8;color:#8b96a7}.sp.done{background:var(--b2);color:var(--b)}.sp.now{background:#fff0e8;color:var(--o);font-weight:700}.title{font-weight:800;color:var(--n)}.muted{color:var(--m)}.small{font-size:13px}.tiny{font-size:11px}.btn{border:0;background:var(--b);color:#fff;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.s{background:#eef5ff;color:var(--b)}.btn.w{background:#fff;border:1px solid var(--line);color:#647186}.kpi{display:flex;justify-content:space-between;align-items:center}.num{font-size:28px;font-weight:800;color:var(--n)}.lab{font-size:12px;color:var(--m);margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;color:var(--n);font-size:24px}.section{font-size:17px;font-weight:800;color:var(--n);margin-bottom:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{font-size:11px;color:#909bad;background:#fafbfd}.split{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.timeline{border-left:2px solid #e0e8f2;padding-left:18px}.ti{position:relative;padding:0 0 16px}.ti:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;left:-24px;top:4px;background:#fff;border:3px solid #b8c5d7}.ti.done:before{background:var(--b);border-color:var(--b)}.ti.now:before{border-color:var(--o)}.ti b{display:block;color:var(--n);font-size:13px}.photo{height:110px;border-radius:14px;background:linear-gradient(135deg,#cfdfee,#f4f9ff 50%,#b7cee1);position:relative;overflow:hidden}.photo:after{content:"💧";font-size:42px;position:absolute;right:22%;bottom:12px;opacity:.55}.photo.ok{background:linear-gradient(135deg,#dcefe7,#f9fffc)}.photo.ok:after{content:"✓";color:var(--g)}.phonebox{display:grid;place-items:center;padding:14px}.phone{width:390px;min-height:790px;background:#fff;border:9px solid #172033;border-radius:42px;overflow:hidden;position:relative;box-shadow:0 22px 50px #1720332b}.status{height:36px;padding:8px 16px;font-size:11px;display:flex;justify-content:space-between}.mob{min-height:736px;background:#f5f8fc;padding-bottom:78px}.mh{margin:0 12px 12px;background:linear-gradient(135deg,#1075ff,#50a0ff);color:#fff;padding:20px;border-radius:21px}.mh h2{margin:6px 0;font-size:21px}.mh p{margin:0;font-size:12px;opacity:.9}.mc{background:#fff;margin:11px 12px;padding:15px;border-radius:17px;box-shadow:0 5px 15px #20466f0b}.mct{font-size:15px;font-weight:800;color:var(--n);display:flex;justify-content:space-between;margin-bottom:11px}.mct span{font-size:10px;color:#99a3b3;font-weight:500}.serv{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.sv{text-align:center;font-size:10px;cursor:pointer}.svi{width:45px;height:45px;border-radius:15px;background:#eff6ff;color:var(--b);display:grid;place-items:center;margin:0 auto 6px;font-size:18px}.sv:first-child .svi{background:var(--b);color:#fff}.row{padding:11px 0;border-bottom:1px solid #edf1f6;display:flex;justify-content:space-between;align-items:center}.row:last-child{border:0}.bot{position:absolute;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-top:8px}.bot div{text-align:center;font-size:10px;color:#8e9 left:55%;bottom:25px}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.g4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.switch{display:none}}@media(max-width:600px){.top{padding:0 10px;height:56px}.logo span{display:none}.main{padding:10px}.phonebox{padding:0}.phone{width:100%;min-height:calc(100vh - 56px);border:0;border-radius:0;box-shadow:none}.status{display:none}.mob{min-height:calc(100vh - 56px)}.g4,.g3,.g2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const D={id:'LT202609030018',pro:'蓝海嘉园',loc:'3号楼 2单元 一楼公共区域',txt:'一楼楼道水管漏水，地面积水比较严重，请尽快处理。',s:+localStorage.s||0,staff:'王海'};const names=['待物业受理','已受理','已派单','维修人员已接单','已到达现场','待居民确认','已完成'];const steps=['居民上报','物业受理','完成派单','人员接单','到达现场','提交完成','居民确认'];const times=['09:32','09:34','09:36','09:38','09:46','10:08','10:11'];function go(x){location.hash=x;render()}function setS(n){D.s=Math.max(D.s,n);localStorage.s=D.s;render()}function reset(){D.s=0;localStorage.s=0;go('hub')}function role(){let h=location.hash||'#hub';return h.includes('resident')?'resident':h.includes('work')?'work':h.includes('staff')?'staff':h.includes('group')?'group':'hub'}function top(inner){let r=role(),a=[['hub','演示导航'],['resident-home','居民小程序'],['work-center','工单中心'],['staff-tasks','工作人员'],['group-dashboard','集团监管']];return `<div class="top"><div class="logo"><div class="mark">⌁</div><span>蓝投一码呼 · V0.1</span></div><div class="switch">${a.map(x=>`<button class="${(r==='hub'&&x[0]=='hub')||x[0].startsWith(r)?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><button class="reset" onclick="reset()">重置演示</button></div>${inner}`}function pc(c,nav){let r=role(),N=r==='group'?[['group-dashboard','集团驾驶舱'],['group-trace','工单穿透']]:r==='work'?[['work-center','工单中心'],['work-detail','工单详情'],['work-dispatch','受理派单']]:[['hub','演示导航']];return top(`<div class="shell"><aside class="side"><div class="st">当前角色</div><div class="nav on">${r==='group'?'🏢 蓝投集团运营管理':'🏠 蓝海嘉园物业服务中心'}</div><div class="st" style="margin-top:14px">演示页面</div>${N.map(x=>`<div class="nav ${location.hash=='#'+x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</div>`).join('')}<div class="st" style="margin-top:16px">统一工单</div><div class="card" style="padding:11px;box-shadow:none;background:#f7f9fc"><div class="tiny muted">${D.id}</div><div class="small title" style="margin-top:4px">公共区域漏水</div><div style="margin-top:7px"><span class="pill ${D.s==0?'o':D.s>=5?'g':''}">${names[D.s]}</span></div></div></aside><main class="main">${c}</main></div>`)}function phone(c){return top(`<div class="phonebox"><div class="phone"><div class="status"><span>9:41</span><span>●●● 5G 🔋</span></div>${c}</div></div>`)}function bot(on){return `<div class="bot"><div class="${on=='h'?'on':''}" onclick="go('resident-home')">⌂<br>首页</div><div class="${on=='o'?'on':''}" onclick="go('resident-progress')">▤<br>工单</div><div>◉<br>消息</div><div>○<br>我的</div></div>`}function timeline(){let n=['居民提交诉求','物业完成受理','已派单 · 王海','维修人员已接单','维修人员到达现场','维修完成 · 待居民确认','居民确认 · 非常满意'];return `<div class="timeline">${n.map((x,i)=>`<div class="ti ${i<D.s?'done':i==D.s?'now':''}"><span class="tiny muted">${i<=D.s?times[i]:'待处理'}</span><b>${x}</b></div>`).join('')}</div>`}
function hub(){return pc(`<div class="hero"><div><h1>蓝投“一码呼”全流程演示原型</h1><p>居民上报为主 · 物业协同为辅 · 集团全过程监管</p></div><span class="pill" style="background:#ffffff2a;color:#fff">统一演示工单 · ${D.id}</span></div><div class="grid g4 mt"><div class="card role" onclick="go('resident-home')"><div class="ic">📱</div><h3>居民端</h3><p>扫码进入、诉求上报、进度查询、确认评价。</p><span class="pill">开始演示</span></div><div class="card role" onclick="go('work-center')"><div class="ic">📥</div><h3>工单中心</h3><p>统一受理、辅助分类、人员推荐、派单跟踪。</p><span class="pill o">物业协同</span></div><div class="card role" onclick="go('staff-tasks')"><div class="ic">🛠</div><h3>工作人员端</h3><p>接单、上门、现场处置、上传结果。</p><span class="pill g">移动处置</span></div><div class="card role" onclick="go('group-dashboard')"><div class="ic">🏢</div><h3>集团监管</h3><p>多项目总览、服务指标、全过程穿透监管。</p><span class="pill">运营监管</span></div></div><div class="card mt demo"><div><div class="small muted">当前演示案例</div><div class="title">${D.pro} · ${D.loc} · 公共区域漏水</div></div><div class="steps">${steps.map((x,i)=>`<span class="sp ${i<D.s?'done':i==D.s?'now':''}">${x}</span>`).join('')}</div></div>`)}
function residentHome(){return phone(`<div class="mob"><div class="mh"><div class="tiny">蓝投社区居民服务</div><h2>蓝海嘉园 · 一码呼</h2><p>${D.loc} · 扫码位置已识别</p></div><div class="mc"><div class="mct">我要办理 <span>简单一点 · 快一点</span></div><div class="serv"><div class="sv" onclick="go('resident-report')"><div class="svi">🔧</div>我要报修</div><div class="sv"><div class="svi">💬</div>我要反映</div><div class="sv"><div class="svi">📣</div>我要投诉</div><div class="sv"><div class="svi">💡</div>我要建议</div><div class="sv"><div class="svi">♡</div>我要帮</div></div></div><div class="mc"><div class="mct">我的工单 <span onclick="go('resident-progress')">查看全部 ›</span></div><div class="row" onclick="go('resident-progress')"><div><div class="small title">公共区域漏水</div><div class="tiny muted">${D.loc}</div></div><span class="pill ${D.s==0?'o':D.s>=5?'g':''}">${names[D.s]}</span></div></div><div class="mc"><div class="mct">社区通知 <span>更多 ›</span></div><div class="row"><div><div class="small title">消防设施例行检查通知</div><div class="tiny muted">今日 13:00—15:00</div></div><span>›</span></div></div></div>${bot('h')}`)}
function residentReport(){return phone(`<div class="mob"><div class="mphead"><button class="back" onclick="go('resident-home')">‹</button><b>我要报修</b></div><div class="fs"><div class="fl">问题类型</div><div class="chips"><span class="chip on">水电维修</span><span class="chip">电梯</span><span class="chip">门禁</span><span class="chip">公共设施</span><span class="chip">环境卫生</span></div></div><div class="fs"><div class="fl">问题位置</div><div class="loc"><b>${D.pro} · ${D.loc}</b><br><span style="color:var(--b)">📍 由二维码自动识别</span></div></div><div class="fs"><div class="fl">问题描述</div><textarea class="ta">${D.txt}</textarea><div class="tiny muted">支持文字 / 语音输入</div></div><div class="fs"><div class="fl">现场照片</div><div class="photos"><div class="photo"></div><div class="photo"></div></div><div class="chips" style="margin-top:10px"><span class="chip on">● 情况比较紧急</span></div></div></div><div class="submit"><button class="btn" onclick="setS(0);go('resident-progress')">提交诉求</button></div>`)}
function residentProgress(){return phone(`<div class="mob"><div class="mphead"><button class="back" onclick="go('resident-home')">‹</button><b>工单进度</b></div><div class="sc"><div class="bigic">${D.s>=5?'✓':'◷'}</div><div class="title" style="font-size:19px;margin-top:8px">${names[D.s]}</div><div class="tiny muted">工单 ${D.id}</div><div class="metrics"><div><b>${D.s>=1?'2':'--'}分钟</b><span class="tiny muted">首次响应</span></div><div><b>${D.s>=4?'14':'--'}分钟</b><span class="tiny muted">到达现场</span></div><div><b>${D.s>=5?'36':'--'}分钟</b><span class="tiny muted">处理完成</span></div></div></div><div class="mc"><div class="mct">处理进度</div>${timeline()}</div>${D.s>=5?`<div class="mc"><div class="mct">处理结果</div><div class="photos"><div><div class="photo"></div><div class="tiny muted">处理前</div></div><div><div class="photo ok"></div><div class="tiny muted">处理后</div></div></div><p class="small">已更换破损管件并完成地面积水清理，现场检查正常。</p>${D.s==5?`<div style="display:flex;gap:7px"><button class="btn" style="flex:1" onclick="setS(6)">问题已解决</button><button class="btn w" style="flex:1">问题未解决</button></div>`:`<span class="pill g">居民评价：非常满意 ★★★★★</span>`}</div>`:''}</div>${bot('o')}`)}
function workCenter(){return pc(`<div class="head"><div><h1>工单中心</h1><div class="small muted">蓝海嘉园物业服务中心 · 今日服务工作台</div></div></div><div class="grid g4 mt"><div class="card kpi"><div><div class="num">28</div><div class="lab">今日新增</div></div><div class="ic">＋</div></div><div class="card kpi"><div><div class="num">${D.s==0?6:5}</div><div class="lab">待受理</div></div><div class="ic">📥</div></div><div class="card kpi"><div><div class="num">${D.s>0&&D.s<6?20:19}</div><div class="lab">处理中</div></div><div class="ic">◷</div></div><div class="card kpi"><div><div class="num">2</div><div class="lab">超时工单</div></div><div class="ic">!</div></div></div><div class="split mt"><div class="card"><div class="section">${D.s==0?'待处理工单':'今日工单'}</div><table class="table"><tr><th>工单</th><th>位置</th><th>类型</th><th>状态</th><th>操作</th></tr><tr><td><b>${D.id}</b><br><span class="tiny muted">09:32</span></td><td>${D.loc}</td><td>水电维修<br><span class="pill o">较紧急</span></td><td><span class="pill ${D.s==0?'o':D.s>=5?'g':''}">${names[D.s]}</span></td><td><button class="btn s" onclick="go('work-detail')">${D.s==0?'立即受理':'查看详情'}</button></td></tr><tr><td>LT202609030017</td><td>5号楼 地下车库</td><td>环境卫生</td><td><span class="pill g">处理中</span></td><td>查看</td></tr><tr><td>LT202609030016</td><td>8号楼 1单元</td><td>门禁故障</td><td><span class="pill">已派单</span></td><td>查看</td></tr></table></div><div class="card"><div class="section">今日工单类型</div>${[['维修',43],['环境',22],['秩序',18],['投诉',8],['其他',9]].map(x=>`<div style="margin:14px 0"><div class="small" style="display:flex;justify-content:space-between"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></div>`)}
